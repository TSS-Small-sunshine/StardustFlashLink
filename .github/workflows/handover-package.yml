name: Package Handover Bundle

# 交接包封包：把 handover/<快照>/ 打成交付 ZIP + .sha256，发到 Release 附件。
# 所有「封包」动作都在 GitHub 上完成 —— 本地不再手工 Compress-Archive
#（避免"本地有、CI 没有"的不可追溯版本）。
#
# 实测注意（2026-09-27）：
#   1) GitHub 会把 release 附件名里的非 ASCII 字符剥掉（实测 `交接包-x.zip` -> `-x.zip`），
#      所以 ZIP 文件名刻意用 ASCII：`handover-<快照>.zip`；中文只出现在 Release 说明里。
#   2) Release 说明从 `handover/RELEASE-NOTES.md`（UTF-8）读取，代入 {{SNAPSHOT}}/{{SHA}}/{{RUN}}。
on:
  push:
    paths:
      - 'handover/**'
      - '.github/workflows/handover-package.yml'
  workflow_dispatch:
    inputs:
      snapshot:
        description: '快照目录名（handover 下的子目录，如 20260927）'
        required: false
        default: '20260927'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve snapshot
        shell: pwsh
        run: |
          $snap = "${{ github.event.inputs.snapshot }}"
          if ([string]::IsNullOrWhiteSpace($snap)) {
            $snap = (Get-ChildItem handover -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          }
          if (-not (Test-Path "handover/$snap")) { throw "handover/$snap 不存在" }
          "SNAPSHOT=$snap" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "快照目录: handover/$snap"

      # 凭据守卫：材料里出现私钥类文件、或明文口令形态 -> 直接拒绝封包
      - name: Guard (凭据不得入包)
        shell: pwsh
        run: |
          $dir = "handover/$env:SNAPSHOT"

          $bad = Get-ChildItem $dir -Recurse -File | Where-Object {
            $_.Extension -in '.p12','.jks','.keystore','.pfx','.pem','.key' -or $_.Name -match '(?i)credential|secret|\.env'
          }
          if ($bad) {
            $bad | ForEach-Object { Write-Host "::error file=$($_.FullName)::凭据类文件不得随交接材料分发" }
            throw "交接材料内含凭据类文件"
          }

          # 明文口令形态：`口令 : <32 位以上十六进制>`
          $pattern = '口令\s*[:\uFF1A]\s*[0-9a-fA-F]{32,}'
          $sample  = '口令     : 0123456789abcdef0123456789abcdef'
          if ($sample -notmatch $pattern) { throw "守卫自检失败：正则未命中样本（脚本编码/解析异常）" }

          $hits = Select-String -Path (Join-Path $dir '*') -Pattern $pattern -ErrorAction SilentlyContinue
          if ($hits) {
            $hits | ForEach-Object { Write-Host "::error file=$($_.Path),line=$($_.LineNumber)::疑似明文口令" }
            throw "交接材料内含明文口令"
          }
          Write-Host "凭据守卫: OK（无密钥文件 / 无明文口令）"

      - name: Package ZIP
        shell: pwsh
        run: |
          $dir   = "handover/$env:SNAPSHOT"
          $files = Get-ChildItem $dir -File | Sort-Object Name
          if ($files.Count -lt 5) { throw "交接材料不足（$($files.Count) 个文件）" }

          # 文件名用 ASCII（见文件头实测注意 1）
          $out = "handover-$env:SNAPSHOT.zip"
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path $files.FullName -DestinationPath $out -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $out).Path)
          $names = @($zip.Entries | ForEach-Object { $_.FullName })
          $zip.Dispose()
          if ($names.Count -ne $files.Count) { throw "ZIP 条目数 $($names.Count) 与文件数 $($files.Count) 不符" }

          $size = (Get-Item $out).Length
          if ($size -lt 10000) { throw "ZIP 过小（$size 字节），疑似封包不完整" }
          $leaf = Split-Path $out -Leaf
          $sha  = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          "$sha  $leaf" | Out-File "$out.sha256" -Encoding ascii
          "ZIP_PATH=$out"    | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ASSET_NAME=$leaf" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ZIP 条目: $($names.Count) 个"
          Write-Host "产物: $leaf  $size 字节"
          Write-Host "SHA256: $sha"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: handover-bundle-${{ env.SNAPSHOT }}
          path: |
            *.zip
            *.zip.sha256
          if-no-files-found: error

      - name: Publish Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $snap = $env:SNAPSHOT
          $zip  = $env:ZIP_PATH
          $tag  = "handover-$snap"
          $tpl  = "handover/RELEASE-NOTES.md"
          if (Test-Path $tpl) {
            # 以 UTF-8 读取，保证中文说明正确
            $body = (Get-Content $tpl -Raw -Encoding utf8).Trim()
            $body = $body.Replace('{{SNAPSHOT}}', $snap).Replace('{{SHA}}', "${{ github.sha }}").Replace('{{RUN}}', "${{ github.run_number }}")
          } else {
            $body = "Handover bundle $snap (auto-packaged by GitHub Actions)."
          }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --yes --cleanup-tag }
          gh release create $tag "$zip" "$zip.sha256" --title "交接包 $snap" --notes $body --prerelease --target "$env:GITHUB_SHA"
          gh release view $tag --json url,tagName,assets
