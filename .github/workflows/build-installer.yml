name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      title:
        description: '版本化 release 的标题（留空 = 沿用现有标题，仍为空则用 v{版本}）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup 6 (Chocolatey)
        shell: pwsh
        continue-on-error: true
        run: choco install innosetup --no-progress -y

      - name: Fallback install Inno Setup 6 (official silent installer)
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          if ($candidates | Where-Object { Test-Path $_ }) { Write-Host "ISCC 已就绪（Chocolatey 安装成功）"; exit 0 }
          Write-Host "Chocolatey 未装上，改用官方静默安装…"
          $exe = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $exe -UseBasicParsing
          Start-Process -FilePath $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          if (-not ($candidates | Where-Object { Test-Path $_ })) { throw "Inno Setup 安装失败" }

      - name: Locate ISCC and ensure Chinese language file
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "未找到 ISCC.exe" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ISCC = $iscc"

          $langDir  = Join-Path (Split-Path $iscc -Parent) "Languages"
          $langFile = Join-Path $langDir "ChineseSimplified.isl"
          if (-not (Test-Path $langFile)) {
            New-Item -ItemType Directory -Force -Path $langDir | Out-Null
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile $langFile -UseBasicParsing
            Write-Host "已下载中文语言文件"
          }
          $size = (Get-Item $langFile).Length
          Write-Host "ChineseSimplified.isl = $size 字节"
          if ($size -lt 1000) { throw "中文语言文件异常（$size 字节）" }

      - name: Prepare NSSM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "tools" | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "nssm.zip"
          Invoke-WebRequest -Uri "https://nssm.cc/release/nssm-2.24.zip" -OutFile $zip -UseBasicParsing
          $dst = Join-Path $env:RUNNER_TEMP "nssm-extract"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          Copy-Item (Join-Path $dst "nssm-2.24\win64\nssm.exe") "tools\nssm.exe" -Force
          $size = (Get-Item "tools\nssm.exe").Length
          Write-Host "tools\nssm.exe = $size 字节"
          if ($size -lt 100000) { throw "nssm.exe 异常" }

      - name: Prepare embedded Python
        shell: pwsh
        run: |
          # 官方 embeddable 包（纯标准库脚本专用运行时的最小发行版）
          # 按顺序尝试，第一个成功下载的即采用（避免某个小版本被撤下导致构建失败）
          $candidates = @(
            "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip",
            "https://www.python.org/ftp/python/3.12.9/python-3.12.9-embed-amd64.zip",
            "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip"
          )
          $zip = Join-Path $env:RUNNER_TEMP "python-embed.zip"
          $ok = $false
          foreach ($u in $candidates) {
            try {
              Write-Host "尝试下载: $u"
              Invoke-WebRequest -Uri $u -OutFile $zip -UseBasicParsing -TimeoutSec 180
              if ((Get-Item $zip).Length -gt 5000000) { Write-Host "下载成功: $((Get-Item $zip).Length) 字节"; $ok = $true; break }
            } catch { Write-Host "失败: $($_.Exception.Message)" }
          }
          if (-not $ok) { throw "内嵌 Python 下载失败（所有候选地址均不可用）" }

          $dst = "python"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dst -Force

          $py = Join-Path $dst "python.exe"
          if (-not (Test-Path $py)) { throw "解压后未找到 python.exe" }
          $ver = (& $py -c "import sys; print(sys.version)" 2>&1) -join ' '
          Write-Host "内嵌 Python 版本: $ver"
          Write-Host "内嵌 Python 文件数: $((Get-ChildItem $dst -Recurse -File).Count)"

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}" -replace '^v',''
          } else {
            # 从 version.py 读 VERSION（避免硬编码）
            $versionFile = "version.py"
            if (Test-Path $versionFile) {
              $match = Select-String -Path $versionFile -Pattern '^VERSION\s*=\s*["'']([^"'']+)["'']' | Select-Object -First 1
              if ($match) {
                $v = $match.Matches[0].Groups[1].Value
                Write-Host "Read VERSION from version.py: $v"
              } else {
                Write-Host "::error::VERSION not found in version.py"
                exit 1
              }
            } else {
              Write-Host "::error::version.py not found"
              exit 1
            }
          }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "APP_VERSION = $v"

      - name: Build installer with ISCC
        shell: pwsh
        run: |
          & "$env:ISCC" "/DMyAppVersion=$env:APP_VERSION" "packaging\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败（退出码 $LASTEXITCODE）" }

      - name: Verify installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem "packaging\output\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "未找到编译产物 .exe" }
          Write-Host "产物: $($exe.FullName)"
          Write-Host "大小: $($exe.Length) 字节 ($([math]::Round($exe.Length/1MB,2)) MB)"
          Write-Host "SHA256: $((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
          if ($exe.Length -lt 500000) { throw "产物过小，可能编译不完整" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrcomAutoLogin-Setup
          path: packaging/output/*.exe
          if-no-files-found: error

      - name: Publish Release (tag installer)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem "packaging\output\*.exe" | Select-Object -First 1
          $tag = "installer"
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()

          # 发布说明 = 仓库模板 packaging/RELEASE-NOTES.md（UTF-8 读 + 占位符替换 + --notes-file）。
          # 注意：here-string 里**不要**用反引号转义 $ —— `` `$ `` 会让变量不展开，
          # 页面上就会直接显示 $env:APP_VERSION / $sha（旧版 bug）。
          $tpl = "packaging\RELEASE-NOTES.md"
          if (Test-Path $tpl) {
            $body = (Get-Content $tpl -Raw -Encoding utf8).Trim()
          } else {
            $body = "Windows 安装程序 v$env:APP_VERSION（Inno Setup 自动构建）。"
          }
          $body = $body.Replace('{{VERSION}}', $env:APP_VERSION)
          $body = $body.Replace('{{ASSET}}', $exe.Name)
          $body = $body.Replace('{{SIZE}}', "$($exe.Length)")
          $body = $body.Replace('{{SIZE_MB}}', ([math]::Round($exe.Length / 1MB, 2)).ToString())
          $body = $body.Replace('{{SHA256}}', $sha)
          $body = $body.Replace('{{SHA}}', "${{ github.sha }}")
          $body = $body.Replace('{{RUN}}', "${{ github.run_number }}")
          $body = $body.Replace('{{DATE}}', (Get-Date -Format 'yyyy-MM-dd'))
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-installer.md"
          [IO.File]::WriteAllText($notesFile, $body, (New-Object Text.UTF8Encoding($false)))

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }
          # 标题带版本号：与版本化 release 一起出现在发布列表里时能看出归属
          gh release create $tag $exe.FullName --title "Windows 安装程序 v$env:APP_VERSION（跟随最新构建 · 固定下载链接）" --notes-file $notesFile --prerelease --target "$env:GITHUB_SHA"
          gh release view $tag --json url,tagName,name,isPrerelease,assets

      # P1-5：自动升级通道。`/releases/latest` 只返回**非 prerelease** release，
      # 所以这里发布带版本号的正式 release（tag = v{版本}），客户端才能取到版本 + digest。
      - name: Publish versioned release (tag v{version})
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem "packaging\output\*.exe" | Select-Object -First 1
          $tag = "v$env:APP_VERSION"
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()

          # 发布说明与 installer 同源：仓库模板 packaging/RELEASE-NOTES.md
          $tpl = "packaging\RELEASE-NOTES.md"
          if (Test-Path $tpl) {
            $body = (Get-Content $tpl -Raw -Encoding utf8).Trim()
          } else {
            $body = "Windows 安装程序 v$env:APP_VERSION（Inno Setup 自动构建）。"
          }
          $body = $body.Replace('{{VERSION}}', $env:APP_VERSION)
          $body = $body.Replace('{{ASSET}}', $exe.Name)
          $body = $body.Replace('{{SIZE}}', "$($exe.Length)")
          $body = $body.Replace('{{SIZE_MB}}', ([math]::Round($exe.Length / 1MB, 2)).ToString())
          $body = $body.Replace('{{SHA256}}', $sha)
          $body = $body.Replace('{{SHA}}', "${{ github.sha }}")
          $body = $body.Replace('{{RUN}}', "${{ github.run_number }}")
          $body = $body.Replace('{{DATE}}', (Get-Date -Format 'yyyy-MM-dd'))
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-$tag.md"
          [IO.File]::WriteAllText($notesFile, $body, (New-Object Text.UTF8Encoding($false)))
          # 标题策略：优先 workflow_dispatch 的 title；其次沿用现有 release 的人工标题（避免 CI 覆盖）；
          # 都没有才退回 v{版本}。这样发布列表里始终是可读的「vX.Y.Z — 简述」。
          $title = "v$env:APP_VERSION"
          $old = gh release view $tag --json name 2>$null | ConvertFrom-Json
          if ($old -and $old.name) { $title = $old.name }
          if ("${{ github.event.inputs.title }}" -ne "") { $title = "${{ github.event.inputs.title }}" }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }
          gh release create $tag $exe.FullName --title $title --notes-file $notesFile --target "$env:GITHUB_SHA"
          gh release view $tag --json url,tagName,isPrerelease,assets
