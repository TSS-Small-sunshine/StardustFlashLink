name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      # 只改文档 / CI / 发版模板的提交不重新打安装包：
      # 既省 runner，也避免「发版 tag 被一次无关提交挪走」（产物本身不变）。
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
      - '.github/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      title:
        description: '版本化 release 的标题（留空 = 用模板里的 RELEASE-TITLE，仍为空则用 v{版本}）'
        required: false
        default: ''
      dry_run:
        description: 'true = 只渲染并打印发布说明，不创建/覆盖 release（验证 workflow 改动用）'
        required: false
        default: 'false'
      allow_republish:
        description: 'true = 允许覆盖已存在的同名 v{版本} release（默认 false：版本号没递增就跳过正式版发布）'
        required: false
        default: 'false'

permissions:
  contents: write

# 审计 P2-5：发布是「先删后建」，两次构建并发会互相踩（删掉对方刚建的 tag / 重复同名 release）。
# 同一 ref 串行；不取消进行中的那次（发布动作不能半路掐断）。
concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    # 审计 P2-7：GitHub 表达式只在 env: 里求值，禁止拼进 shell 脚本正文 ——
    # workflow_dispatch 标题 / 分支名 / tag 名里若带引号、分号或 $(...)，拼进 PowerShell 就是命令注入。
    # 脚本里一律读 $env:XXX（push 事件没有 inputs，对应值为空串，语义与原来的空表达式一致）。
    env:
      INPUT_TITLE: ${{ github.event.inputs.title }}
      INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
      INPUT_ALLOW_REPUBLISH: ${{ github.event.inputs.allow_republish }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      GIT_REF: ${{ github.ref }}
      REPO_SLUG: ${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      #   审计 P2-4 / J7：上游二进制零校验 —— 供应链收口
      #   nssm.exe 会以 LocalSystem 常驻、内嵌 Python 是运行库、ISCC 是编译器；
      #   三样以前都只凭「文件够大」判真伪 = 信任三条第三方 HTTP 链路。
      #   现在唯一事实来源是仓库根的 tools.lock.json（本 YAML 里不写任何哈希字面量）。
      #   本步骤：定位 / 解析 lock，并把「比对 SHA256」的公共函数写进 RUNNER_TEMP
      #   （临时文件，不入库、不进 git status），后面的下载步骤 dot-source 它。
      # ============================================================
      - name: Load tools.lock.json (supply-chain guard)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lockPath = @(
            (Join-Path $env:GITHUB_WORKSPACE "tools.lock.json"),
            (Join-Path $env:GITHUB_WORKSPACE "packaging/tools.lock.json")
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1

          $helper = Join-Path $env:RUNNER_TEMP "tools-lock-guard.ps1"
          # 生成校验器。注意：哈希只从 lock 读，这里不出现任何 sha256 字面量。
          # 每行用单引号包住 -> PowerShell 不会提前展开 $ 变量，写进文件的就是函数原文。
          $lines = @(
            '# tools.lock.json 校验器（build-installer.yml 生成到 RUNNER_TEMP，不入库）',
            'function Get-ToolLockDocument {',
            '    param([string]$LockPath)',
            '    if (-not $LockPath -or -not (Test-Path -LiteralPath $LockPath -PathType Leaf)) { return $null }',
            '    try { return (Get-Content -LiteralPath $LockPath -Raw -Encoding utf8 | ConvertFrom-Json) }',
            '    catch { Write-Host ("::warning::tools.lock.json 解析失败：" + $_.Exception.Message); return $null }',
            '}',
            '',
            'function Get-ToolLockEntry {',
            '    param($Lock, [string]$Url)',
            '    if (-not $Lock) { return $null }',
            '    foreach ($t in @($Lock.tools)) {',
            '        if ($t -and $t.url -and ([string]$t.url).Trim() -eq $Url) { return $t }',
            '    }',
            '    return $null',
            '}',
            '',
            '# 校验一个已下载的文件：返回 $true = 已按 lock 校验通过；$false = lock 缺失/无条目（按策略降级）',
            'function Assert-LockedDownload {',
            '    param(',
            '        [Parameter(Mandatory=$true)][string]$Path,',
            '        [Parameter(Mandatory=$true)][string]$Url,',
            '        [string]$Label = "下载物",',
            '        [switch]$Required',
            '    )',
            '    if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { throw ("$Label 不存在，无法校验：" + $Path) }',
            '    $lock = Get-ToolLockDocument -LockPath $env:TOOL_LOCK_PATH',
            '    if (-not $lock) {',
            '        if ($Required) {',
            '            Write-Host "::error::$Label 是强制校验项，但 tools.lock.json 缺失或无法解析（TOOL_LOCK_PATH=$env:TOOL_LOCK_PATH）"',
            '            throw "$Label 供应链校验失败：没有可用的 tools.lock.json"',
            '        }',
            '        Write-Host "::warning::$Label 没有可用的 tools.lock.json，跳过哈希校验（仅做大小检查）"',
            '        return $false',
            '    }',
            '    $entry = Get-ToolLockEntry -Lock $lock -Url $Url',
            '    if (-not $entry) {',
            '        if ($Required) {',
            '            Write-Host "::error::$Label 是强制校验项，但 tools.lock.json 里没有它的条目：$Url"',
            '            throw "$Label 供应链校验失败：lock 缺少条目"',
            '        }',
            '        Write-Host "::warning::$Label 在 tools.lock.json 里没有条目（$Url），回退为仅检查大小、不阻断构建；请尽快补锁"',
            '        return $false',
            '    }',
            '    $expected = ([string]$entry.sha256).Trim().ToLower()',
            '    if ($expected -notmatch "^[0-9a-f]{64}$") {',
            '        Write-Host "::error::tools.lock.json 里 $Label 的 sha256 不是 64 位十六进制：$expected"',
            '        throw "$Label 供应链校验失败：lock 条目格式非法"',
            '    }',
            '    $actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLower()',
            '    $size = (Get-Item -LiteralPath $Path).Length',
            '    if ($entry.size_bytes -and ([int64]$entry.size_bytes -ne $size)) {',
            '        Write-Host "::warning::$Label 大小与 lock 记录不一致（期望 $($entry.size_bytes) 字节，实际 $size 字节），以 SHA256 判定为准"',
            '    }',
            '    if ($actual -ne $expected) {',
            '        Write-Host "::error::$Label SHA256 不匹配：期望 $expected（tools.lock.json），实际 $actual（来源 $Url）"',
            '        throw "$Label 供应链校验失败：哈希不匹配，拒绝使用该下载物"',
            '    }',
            '    Write-Host "[校验通过] $Label 版本 $($entry.version)，SHA256 $actual，$size 字节（来源 $Url）"',
            '    return $true',
            '}',
            '',
            '# 审计 P2-4 后续：上游镜像（尤其 nssm.cc）会偶发 503，下载必须有界重试，',
            '# 否则一次临时 503 就让整个发版构建红（v2.1.3.5 首次构建真踩过）。',
            'function Invoke-DownloadWithRetry {',
            '    param(',
            '        [Parameter(Mandatory=$true)][string]$Url,',
            '        [Parameter(Mandatory=$true)][string]$OutFile,',
            '        [int]$MaxAttempts = 3,',
            '        [int]$DelaySeconds = 5,',
            '        [int64]$MinBytes = 0',
            '    )',
            '    for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {',
            '        try {',
            '            Invoke-WebRequest -Uri $Url -OutFile $OutFile -UseBasicParsing -TimeoutSec 120',
            '            if ($MinBytes -gt 0) {',
            '                $size = (Get-Item -LiteralPath $OutFile).Length',
            '                if ($size -lt $MinBytes) { throw ("下载内容过小（" + $size + " 字节 <= " + $MinBytes + "）") }',
            '            }',
            '            if ($attempt -gt 1) { Write-Host ("下载重试成功（第 " + $attempt + " 次）：" + $Url) }',
            '            return $true',
            '        } catch {',
            '            if ($attempt -eq $MaxAttempts) {',
            '                throw ("下载失败（已重试 " + $MaxAttempts + " 次）：" + $Url + " —— " + $_.Exception.Message)',
            '            }',
            '            Write-Host ("::warning::下载失败（第 " + $attempt + "/" + $MaxAttempts + " 次），" + $DelaySeconds + " 秒后重试：" + $Url + " —— " + $_.Exception.Message)',
            '            Start-Sleep -Seconds $DelaySeconds',
            '        }',
            '    }',
            '    return $false',
            '}'
          )
          Set-Content -LiteralPath $helper -Value $lines -Encoding utf8

          "TOOL_LOCK_PATH=$lockPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TOOL_LOCK_HELPER=$helper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if (-not $lockPath) {
            Write-Host "::warning::仓库里没有 tools.lock.json —— 所有下载物退化为「仅检查大小」，NSSM 那一步会因此直接失败"
          } else {
            $doc = Get-Content -LiteralPath $lockPath -Raw -Encoding utf8 | ConvertFrom-Json
            Write-Host ("tools.lock.json = $lockPath（已锁定 " + (@($doc.tools).Count) + " 个固定版本上游文件）")
            foreach ($t in @($doc.tools)) {
              $h = ([string]$t.sha256).ToLower()
              if ($h.Length -ge 12) { $h = $h.Substring(0, 12) + "…" }
              Write-Host ("  - " + $t.name + " " + $t.version + "  sha256=" + $h + "  " + $t.url)
            }
            # 浮动资源（Inno Setup 官方安装器 / choco 的 innosetup 包）不写固定哈希，
            # 但必须诚实地把「未锁定」暴露在 CI 日志里，而不是假装已经校验过。
            # （中文语言文件已改为固定 issrc commit，见 tools[] 的 chinese-simplified-isl。）
            foreach ($n in @($doc.not_locked)) {
              Write-Host ("::warning::未锁定（浮动版本，不写死哈希）：" + $n.name + " — " + $n.url + "；原因见 tools.lock.json 的 not_locked")
            }
          }

      - name: Install Inno Setup 6 (Chocolatey, pinned)
        shell: pwsh
        continue-on-error: true
        run: |
          # build-P2-4 剩余项：主路径的 ISCC 版本必须可控。以前不带 --version，取的是
          # Chocolatey 社区源当前最新版 → 上游一发版，构建用的编译器就跟着变（不可复现）。
          # 6.7.1 是 choco 源当前版本（核对：community.chocolatey.org 的 FindPackagesById?id='innosetup'）。
          choco install innosetup --version=6.7.1 --no-progress -y
          if ($LASTEXITCODE -eq 0) {
            "ISCC_INSTALL_SOURCE=choco" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Fallback install Inno Setup 6 (official silent installer)
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          if ($candidates | Where-Object { Test-Path $_ }) { Write-Host "ISCC 已就绪（Chocolatey 安装成功）"; exit 0 }
          Write-Host "Chocolatey 未装上，改用官方静默安装…"
          # 审计 P2-4：这个 URL 不带版本号（上游 302 到当前最新 6.x），内容会变，
          # 因此没有写进 tools.lock.json 的 tools[]（见 not_locked）。它是 choco 失败时的兜底，
          # 且 ISCC 只参与编译、不进安装包、不以服务身份常驻 —— 风险等级低于 nssm / 内嵌 Python。
          Write-Host "::warning::Inno Setup 官方安装器未做哈希校验（URL 浮动、不含版本号），见 tools.lock.json 的 not_locked"
          Write-Host "::warning::本次走官方静默安装器兜底路径，ISCC 版本未钉死（主路径 choco 固定 6.7.1，兜底只能接受上游当前最新）"
          $exe = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $exe -UseBasicParsing
          Start-Process -FilePath $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          if (-not ($candidates | Where-Object { Test-Path $_ })) { throw "Inno Setup 安装失败" }

      - name: Record and verify ISCC version (pinned)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pinned = "6.7.1"
          # Inno Setup 6 的卸载项写在 Inno Setup 6_is1 下；32 位安装器落在 WOW6432Node，
          # 64 位安装器落在原生视图 —— 两个都看，取到哪个用哪个。
          $keys = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1"
          )
          $installed = $null
          foreach ($k in $keys) {
            if (Test-Path $k) {
              $v = (Get-ItemProperty -Path $k -Name DisplayVersion -ErrorAction SilentlyContinue).DisplayVersion
              if ($v) { $installed = [string]$v; break }
            }
          }
          if (-not $installed) { throw "读不到 Inno Setup 版本（注册表 Inno Setup 6_is1 缺 DisplayVersion）" }
          Write-Host "ISCC 版本 = $installed（期望 $pinned）"
          "ISCC_VERSION=$installed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($env:ISCC_INSTALL_SOURCE -eq "choco") {
            # 主路径必须可控：choco 装出来的版本与钉死值不一致 = 构建不可复现，直接红。
            if ($installed -ne $pinned) {
              throw "Chocolatey 主路径装出的 Inno Setup 版本为 $installed，与钉死的 $pinned 不一致（主路径版本必须可控）"
            }
            Write-Host "ISCC 版本核对通过（choco 主路径，$pinned）"
          } else {
            # 兜底路径不改行为，但必须诚实暴露「版本没钉死」，不能假装可复现。
            Write-Host "::warning::本次没走 choco 主路径（退回官方静默安装器兜底），ISCC 版本未钉死：实际 $installed"
          }

      - name: Locate ISCC and ensure Chinese language file
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "未找到 ISCC.exe" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ISCC = $iscc"

          if (-not $env:TOOL_LOCK_HELPER) { throw "缺少 tools.lock.json 校验器（TOOL_LOCK_HELPER 未设置）" }
          . $env:TOOL_LOCK_HELPER

          $isccDir    = Split-Path $iscc -Parent
          $langDir    = Join-Path $isccDir "Languages"
          $langFile   = Join-Path $langDir "ChineseSimplified.isl"
          $defaultIsl = Join-Path $isccDir "Default.isl"
          $langTmp    = Join-Path $env:RUNNER_TEMP "ChineseSimplified.isl"

          # 审计 P2-4 / P3-15 收口：中文语言文件不再取自 issrc 的浮动 main 分支。
          # URL / SHA256 的唯一来源 = tools.lock.json 的 chinese-simplified-isl 条目
          # （固定到 issrc 某个 commit，内容可复现）；本 YAML 不写任何 URL / 哈希字面量。
          $lock = Get-ToolLockDocument -LockPath $env:TOOL_LOCK_PATH
          $islEntry = $null
          if ($lock) {
            foreach ($t in @($lock.tools)) {
              if ($t -and ([string]$t.name).Trim() -eq "chinese-simplified-isl") { $islEntry = $t; break }
            }
          }

          $langOk = $false
          if ($islEntry -and $islEntry.url) {
            $islUrl = ([string]$islEntry.url).Trim()
            Write-Host ("中文语言文件来源（tools.lock.json）：" + $islUrl + "（版本 " + $islEntry.version + "）")
            if (Test-Path -LiteralPath $langTmp -PathType Leaf) { Remove-Item -LiteralPath $langTmp -Force }
            $downloaded = $false
            try {
              # 有界重试：raw.githubusercontent.com 偶发超时 / 5xx，一次抖动不该打红发版构建。
              Invoke-DownloadWithRetry -Url $islUrl -OutFile $langTmp -MaxAttempts 3 -DelaySeconds 5 -MinBytes 1000 | Out-Null
              $downloaded = $true
            } catch {
              Write-Host ("::warning::Inno 中文语言文件下载失败（已重试）：" + $_.Exception.Message)
            }
            if ($downloaded) {
              # 不传 -Required：lock 缺条目 -> 仅 warning 返回 $false（走下面的降级）；
              # 哈希不匹配 / sha256 格式非法 -> ::error:: + throw，构建必须红，绝不降级。
              $verified = Assert-LockedDownload -Path $langTmp -Url $islUrl -Label "Inno 中文语言文件"
              if ($verified) {
                New-Item -ItemType Directory -Force -Path $langDir | Out-Null
                Copy-Item -LiteralPath $langTmp -Destination $langFile -Force
                Write-Host ("中文语言文件已就绪（已按 tools.lock.json 校验）：" + $langFile)
                $langOk = $true
              } else {
                Write-Host "::warning::Inno 中文语言文件在 tools.lock.json 里没有条目，不使用该下载物"
              }
            }
            if (Test-Path -LiteralPath $langTmp -PathType Leaf) { Remove-Item -LiteralPath $langTmp -Force -ErrorAction SilentlyContinue }
          } else {
            Write-Host "::warning::tools.lock.json 缺少 chinese-simplified-isl 条目 —— 无法固定版本，走降级路径（请尽快补锁）"
          }

          # 降级路径（仅限「lock 缺条目 / 下载失败」；哈希不符在上面已经 throw 了，不会到这里）：
          # 已有 >=1000 字节的 isl 就保留；否则复制 Inno Setup 自带的 Default.isl
          # （安装向导变英文，功能完全正常），保证构建不中断。
          if (-not $langOk) {
            if ((Test-Path -LiteralPath $langFile -PathType Leaf) -and ((Get-Item -LiteralPath $langFile).Length -ge 1000)) {
              $existingSize = (Get-Item -LiteralPath $langFile).Length
              Write-Host ("::warning::保留已有 ChineseSimplified.isl（" + $existingSize + " 字节，未按 lock 校验）")
              $langOk = $true
            } elseif (Test-Path -LiteralPath $defaultIsl -PathType Leaf) {
              New-Item -ItemType Directory -Force -Path $langDir | Out-Null
              Copy-Item -LiteralPath $defaultIsl -Destination $langFile -Force
              Write-Host "::warning::中文语言文件不可用，已降级使用 Default.isl（安装向导为英文，功能正常）"
              $langOk = $true
            }
          }
          if (-not $langOk) { throw "中文语言文件不可用，且找不到 Inno Setup 自带的 Default.isl，无法降级" }

          $size = (Get-Item -LiteralPath $langFile).Length
          Write-Host "ChineseSimplified.isl = $size 字节"
          if ($size -lt 1000) { throw "中文语言文件异常（$size 字节）" }

      - name: Prepare NSSM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TOOL_LOCK_HELPER) { throw "缺少 tools.lock.json 校验器（TOOL_LOCK_HELPER 未设置）" }
          . $env:TOOL_LOCK_HELPER
          New-Item -ItemType Directory -Force -Path "tools" | Out-Null
          $nssmUrl = "https://nssm.cc/release/nssm-2.24.zip"
          $zip = Join-Path $env:RUNNER_TEMP "nssm.zip"
          # 有界重试（503 等临时故障不再直接让发版红）；最终大小异常也会触发重试。
          Invoke-DownloadWithRetry -Url $nssmUrl -OutFile $zip -MaxAttempts 4 -DelaySeconds 8 -MinBytes 100000 | Out-Null
          # 审计 P2-4：nssm.exe 会被复制为 tools\nssm.exe → 打进安装包 → 以 LocalSystem 注册并常驻服务，
          # 是整条供应链里影响面最大的一个。所以它是唯一「强制校验」项：
          # lock 缺失 / lock 里没有条目 / 哈希不匹配 → ::error:: + throw，构建必须红（不降级）。
          Assert-LockedDownload -Path $zip -Url $nssmUrl -Label "NSSM 2.24 压缩包" -Required | Out-Null
          $dst = Join-Path $env:RUNNER_TEMP "nssm-extract"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          Copy-Item (Join-Path $dst "nssm-2.24\win64\nssm.exe") "tools\nssm.exe" -Force
          $size = (Get-Item "tools\nssm.exe").Length
          Write-Host "tools\nssm.exe = $size 字节"
          if ($size -lt 100000) { throw "nssm.exe 异常" }

      - name: Prepare embedded Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TOOL_LOCK_HELPER) { throw "缺少 tools.lock.json 校验器（TOOL_LOCK_HELPER 未设置）" }
          . $env:TOOL_LOCK_HELPER
          # 官方 embeddable 包（纯标准库脚本专用运行时的最小发行版）
          # 按顺序尝试，第一个「下载成功 + 通过 tools.lock.json 校验」的即采用
          # （避免某个小版本被上游撤下导致构建失败）。
          $candidates = @(
            "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip",
            "https://www.python.org/ftp/python/3.12.9/python-3.12.9-embed-amd64.zip",
            "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip"
          )
          $zip = Join-Path $env:RUNNER_TEMP "python-embed.zip"
          $ok = $false
          $usedUrl = ""
          foreach ($u in $candidates) {
            if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue }
            $downloaded = $false
            try {
              Write-Host "尝试下载: $u"
              Invoke-DownloadWithRetry -Url $u -OutFile $zip -MaxAttempts 2 -DelaySeconds 3 -MinBytes 5000000 | Out-Null
              $downloaded = $true
            } catch { Write-Host "下载失败: $($_.Exception.Message)" }

            if (-not $downloaded) { continue }
            # 审计 P2-4：哈希校验放在 try/catch **之外** —— 内容对不上必须让构建红，
            # 不能被「换下一个候选」的容错逻辑吞掉（lock 里缺条目才是可降级的可用性问题：
            # Python 小版本退役时只 ::warning:: 放行，避免整条构建线停产）。
            Assert-LockedDownload -Path $zip -Url $u -Label ("内嵌 Python 压缩包（" + ($u -split "/")[-1] + "）") | Out-Null
            if ((Get-Item -LiteralPath $zip).Length -gt 5000000) {
              Write-Host "下载成功: $((Get-Item -LiteralPath $zip).Length) 字节"
              $ok = $true
              $usedUrl = $u
              break
            }
            Write-Host "压缩包大小异常（<= 5 MB，疑似错误页），换下一个候选"
          }
          if (-not $ok) { throw "内嵌 Python 下载失败（所有候选地址均不可用或大小异常）" }
          Write-Host "内嵌 Python 来源: $usedUrl"

          $dst = "python"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dst -Force

          $py = Join-Path $dst "python.exe"
          if (-not (Test-Path $py)) { throw "解压后未找到 python.exe" }
          $ver = (& $py -c "import sys; print(sys.version)" 2>&1) -join ' '
          Write-Host "内嵌 Python 版本: $ver"
          Write-Host "内嵌 Python 文件数: $((Get-ChildItem $dst -Recurse -File).Count)"

      - name: Resolve version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            $v = "$env:REF_NAME" -replace '^v',''
          } else {
            # 从 version.py 读 VERSION（避免硬编码）
            $versionFile = "version.py"
            if (Test-Path $versionFile) {
              $match = Select-String -Path $versionFile -Pattern '^VERSION\s*=\s*["'']([^"'']+)["'']' | Select-Object -First 1
              if ($match) {
                $v = $match.Matches[0].Groups[1].Value
                Write-Host "Read VERSION from version.py: $v"
              } else {
                Write-Host "::error::VERSION not found in version.py"
                exit 1
              }
            } else {
              Write-Host "::error::version.py not found"
              exit 1
            }
          }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "APP_VERSION = $v"

          # 代号（CODENAME / CODENAME_CN）也一律从 version.py 读 —— v2.1.0.0 的教训：
          # RELEASE-NOTES 头部曾经硬编码 "Sirius"，换了版本线（Vega）后发布页标题还写着旧名 ✗。
          # 现在模板里用 {{CODENAME}} / {{CODENAME_CN}} 占位，CI 来填 ✓。
          $cn = ""
          $cnCn = ""
          if (Test-Path $versionFile) {
            $m1 = Select-String -Path $versionFile -Pattern '^CODENAME\s*=\s*["'']([^"'']+)["'']' | Select-Object -First 1
            $m2 = Select-String -Path $versionFile -Pattern '^CODENAME_CN\s*=\s*["'']([^"'']+)["'']' | Select-Object -First 1
            if ($m1) { $cn = $m1.Matches[0].Groups[1].Value }
            if ($m2) { $cnCn = $m2.Matches[0].Groups[1].Value }
          }
          "APP_CODENAME=$cn" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_CODENAME_CN=$cnCn" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "APP_CODENAME = $cn / $cnCn"

          # 上一版 tag（发布页「与上一版对比」链接用）：取最近的非 installer 版本 tag，
          # 并排除本次要发的版本（重建同一版本时，对比基线应是它的前一版）。
          $prevTag = ""
          $releases = gh release list --exclude-drafts --limit 30 --json tagName 2>$null | ConvertFrom-Json
          foreach ($rel in $releases) {
            if ($rel.tagName -match '^v[0-9]' -and $rel.tagName -ne "v$v") { $prevTag = $rel.tagName; break }
          }
          "APP_PREV_TAG=$prevTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "APP_PREV_TAG = $prevTag"

      - name: Self-test release notes renderer
        shell: pwsh
        run: |
          # 渲染器自带 20+ 项断言（占位符残留 / 隐私规则 / 两套模板可渲染 / 日期时区）。
          # 放在构建之前：模板或脚本写坏了就立刻红，不必等装完包才发现发布页是坏的 ✗
          python .github/scripts/render_release_notes.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "发布说明渲染器自测失败" }

      - name: Build installer with ISCC
        shell: pwsh
        run: |
          & "$env:ISCC" "/DMyAppVersion=$env:APP_VERSION" "packaging\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败（退出码 $LASTEXITCODE）" }

      - name: Verify installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem "packaging\output\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "未找到编译产物 .exe" }
          Write-Host "产物: $($exe.FullName)"
          Write-Host "大小: $($exe.Length) 字节 ($([math]::Round($exe.Length/1MB,2)) MB)"
          Write-Host "SHA256: $((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
          if ($exe.Length -lt 500000) { throw "产物过小，可能编译不完整" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrcomAutoLogin-Setup
          path: packaging/output/*.exe
          if-no-files-found: error

      - name: Publish Release (tag installer)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem "packaging\output\*.exe" | Select-Object -First 1
          $tag = "installer"
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()

          # 发布说明统一由 .github/scripts/render_release_notes.py 渲染：
          # 机器事实（版本 / 大小 / SHA256 / 对比链接 / 上海时区日期）全部由 CI 注入；
          # 渲染后若残留 {{...}} 或命中隐私规则 → 脚本非 0 退出 → 构建直接红 ✗
          # （旧实现是两个 step 各写一遍 $body.Replace(...)，改一处漏一处）
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-installer.md"
          $titleFile = Join-Path $env:RUNNER_TEMP "release-title-installer.txt"
          $renderArgs = @(
            ".github/scripts/render_release_notes.py",
            "--repo", $env:REPO_SLUG,
            "--template", "packaging/RELEASE-NOTES-installer.md",
            "--channel", "installer",
            "--version", "$env:APP_VERSION",
            "--codename", "$env:APP_CODENAME",
            "--codename-cn", "$env:APP_CODENAME_CN",
            "--asset", $exe.Name,
            "--size", "$($exe.Length)",
            "--sha256", $sha,
            "--commit", $env:COMMIT_SHA,
            "--run", $env:RUN_NUMBER,
            "--prev-tag", "$env:APP_PREV_TAG",
            "--out-file", $notesFile,
            "--title-out", $titleFile
          )
          & python @renderArgs
          if ($LASTEXITCODE -ne 0) { throw "发布说明渲染失败（详见上面的 [错误] 行）" }

          if ($env:INPUT_DRY_RUN -eq "true") {
            Write-Host "===== dry_run：渲染结果（不创建 / 不覆盖 release）====="
            Get-Content $notesFile -Raw
            exit 0
          }

          if ($env:GIT_REF -ne "refs/heads/main") {
            Write-Host "::warning::非 main 的构建只产出安装包 artifact，不发布 release（审计 P2-6；ref=$env:GIT_REF）"
            exit 0
          }

          $title = (Get-Content $titleFile -Raw).Trim()
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }
          gh release create $tag $exe.FullName --title $title --notes-file $notesFile --prerelease --target "$env:GITHUB_SHA"
          gh release view $tag --json url,tagName,name,isPrerelease,assets

      # P1-5：自动升级通道。`/releases/latest` 只返回**非 prerelease** release，
      # 所以这里发布带版本号的正式 release（tag = v{版本}），客户端才能取到版本 + digest。
      - name: Publish versioned release (tag v{version})
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem "packaging\output\*.exe" | Select-Object -First 1
          $tag = "v$env:APP_VERSION"
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()

          # 发布说明与 installer 同源：同一个渲染器 + packaging/RELEASE-NOTES.md
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-$tag.md"
          $titleFile = Join-Path $env:RUNNER_TEMP "release-title-$tag.txt"
          $renderArgs = @(
            ".github/scripts/render_release_notes.py",
            "--repo", $env:REPO_SLUG,
            "--template", "packaging/RELEASE-NOTES.md",
            "--channel", "versioned",
            "--version", "$env:APP_VERSION",
            "--codename", "$env:APP_CODENAME",
            "--codename-cn", "$env:APP_CODENAME_CN",
            "--asset", $exe.Name,
            "--size", "$($exe.Length)",
            "--sha256", $sha,
            "--commit", $env:COMMIT_SHA,
            "--run", $env:RUN_NUMBER,
            "--prev-tag", "$env:APP_PREV_TAG",
            "--out-file", $notesFile,
            "--title-out", $titleFile
          )
          & python @renderArgs
          if ($LASTEXITCODE -ne 0) { throw "发布说明渲染失败（详见上面的 [错误] 行）" }

          if ($env:INPUT_DRY_RUN -eq "true") {
            Write-Host "===== dry_run：渲染结果（不创建 / 不覆盖 release）====="
            Get-Content $notesFile -Raw
            exit 0
          }

          if ($env:GIT_REF -ne "refs/heads/main") {
            Write-Host "::warning::非 main 的构建只产出安装包 artifact，不发布正式版 release（审计 P2-6；ref=$env:GIT_REF）"
            exit 0
          }

          # 标题策略：优先 workflow_dispatch 的 title；其次沿用现有 release 的人工标题（避免 CI 覆盖）；
          # 都没有才用模板里的 RELEASE-TITLE（v{版本} — 简述）。
          $title = (Get-Content $titleFile -Raw).Trim()
          $old = gh release view $tag --json name 2>$null | ConvertFrom-Json
          if ($old -and $old.name) { $title = $old.name }
          if ($env:INPUT_TITLE -ne "") { $title = $env:INPUT_TITLE }
          # 审计 P1-1：同名版本 release 已存在 = version.py 没递增。旧行为是
          # delete + create（tag 被挪到新提交、同版本换本体）—— 已装客户端拿 remote==local
          # 就判「已是最新」，这次构建的补丁永远到不了用户 ✗。
          # 默认拒绝覆盖（CI 只给 warning，不红）；确需重发同一版本时显式 allow_republish。
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0 -and $env:INPUT_ALLOW_REPUBLISH -ne "true") {
            Write-Host "::warning::v$env:APP_VERSION 的 release 已存在 —— 版本号没有递增，已跳过正式版发布（installer 固定链接照常更新）。要重发同一版本请用 workflow_dispatch 且 allow_republish=true；否则请先 bump version.py。"
            gh release view $tag --json url,tagName,isPrerelease,assets
            exit 0
          }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }
          gh release create $tag $exe.FullName --title $title --notes-file $notesFile --target "$env:GITHUB_SHA"
          gh release view $tag --json url,tagName,name,isPrerelease,assets
