name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      # 只改文档 / CI / 发版模板的提交不重新打安装包：
      # 既省 runner，也避免「发版 tag 被一次无关提交挪走」（产物本身不变）。
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
      - '.github/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      title:
        description: '版本化 release 的标题（留空 = 用模板里的 RELEASE-TITLE，仍为空则用 v{版本}）'
        required: false
        default: ''
      dry_run:
        description: 'true = 只渲染并打印发布说明，不创建/覆盖 release（验证 workflow 改动用）'
        required: false
        default: 'false'
      allow_republish:
        description: 'true = 允许覆盖已存在的同名 v{版本} release（默认 false：版本号没递增就跳过正式版发布）'
        required: false
        default: 'false'

permissions:
  contents: write

# 审计 P2-5：发布是「先删后建」，两次构建并发会互相踩（删掉对方刚建的 tag / 重复同名 release）。
# 同一 ref 串行；不取消进行中的那次（发布动作不能半路掐断）。
concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    # 审计 P2-7：GitHub 表达式只在 env: 里求值，禁止拼进 shell 脚本正文 ——
    # workflow_dispatch 标题 / 分支名 / tag 名里若带引号、分号或 $(...)，拼进 PowerShell 就是命令注入。
    # 脚本里一律读 $env:XXX（push 事件没有 inputs，对应值为空串，语义与原来的空表达式一致）。
    env:
      INPUT_TITLE: ${{ github.event.inputs.title }}
      INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
      INPUT_ALLOW_REPUBLISH: ${{ github.event.inputs.allow_republish }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      GIT_REF: ${{ github.ref }}
      REPO_SLUG: ${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup 6 (Chocolatey)
        shell: pwsh
        continue-on-error: true
        run: choco install innosetup --no-progress -y

      - name: Fallback install Inno Setup 6 (official silent installer)
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          if ($candidates | Where-Object { Test-Path $_ }) { Write-Host "ISCC 已就绪（Chocolatey 安装成功）"; exit 0 }
          Write-Host "Chocolatey 未装上，改用官方静默安装…"
          $exe = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $exe -UseBasicParsing
          Start-Process -FilePath $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          if (-not ($candidates | Where-Object { Test-Path $_ })) { throw "Inno Setup 安装失败" }

      - name: Locate ISCC and ensure Chinese language file
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "未找到 ISCC.exe" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ISCC = $iscc"

          $langDir  = Join-Path (Split-Path $iscc -Parent) "Languages"
          $langFile = Join-Path $langDir "ChineseSimplified.isl"
          if (-not (Test-Path $langFile)) {
            New-Item -ItemType Directory -Force -Path $langDir | Out-Null
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile $langFile -UseBasicParsing
            Write-Host "已下载中文语言文件"
          }
          $size = (Get-Item $langFile).Length
          Write-Host "ChineseSimplified.isl = $size 字节"
          if ($size -lt 1000) { throw "中文语言文件异常（$size 字节）" }

      - name: Prepare NSSM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "tools" | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "nssm.zip"
          Invoke-WebRequest -Uri "https://nssm.cc/release/nssm-2.24.zip" -OutFile $zip -UseBasicParsing
          $dst = Join-Path $env:RUNNER_TEMP "nssm-extract"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          Copy-Item (Join-Path $dst "nssm-2.24\win64\nssm.exe") "tools\nssm.exe" -Force
          $size = (Get-Item "tools\nssm.exe").Length
          Write-Host "tools\nssm.exe = $size 字节"
          if ($size -lt 100000) { throw "nssm.exe 异常" }

      - name: Prepare embedded Python
        shell: pwsh
        run: |
          # 官方 embeddable 包（纯标准库脚本专用运行时的最小发行版）
          # 按顺序尝试，第一个成功下载的即采用（避免某个小版本被撤下导致构建失败）
          $candidates = @(
            "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip",
            "https://www.python.org/ftp/python/3.12.9/python-3.12.9-embed-amd64.zip",
            "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip"
          )
          $zip = Join-Path $env:RUNNER_TEMP "python-embed.zip"
          $ok = $false
          foreach ($u in $candidates) {
            try {
              Write-Host "尝试下载: $u"
              Invoke-WebRequest -Uri $u -OutFile $zip -UseBasicParsing -TimeoutSec 180
              if ((Get-Item $zip).Length -gt 5000000) { Write-Host "下载成功: $((Get-Item $zip).Length) 字节"; $ok = $true; break }
            } catch { Write-Host "失败: $($_.Exception.Message)" }
          }
          if (-not $ok) { throw "内嵌 Python 下载失败（所有候选地址均不可用）" }

          $dst = "python"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dst -Force

          $py = Join-Path $dst "python.exe"
          if (-not (Test-Path $py)) { throw "解压后未找到 python.exe" }
          $ver = (& $py -c "import sys; print(sys.version)" 2>&1) -join ' '
          Write-Host "内嵌 Python 版本: $ver"
          Write-Host "内嵌 Python 文件数: $((Get-ChildItem $dst -Recurse -File).Count)"

      - name: Resolve version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            $v = "$env:REF_NAME" -replace '^v',''
          } else {
            # 从 version.py 读 VERSION（避免硬编码）
            $versionFile = "version.py"
            if (Test-Path $versionFile) {
              $match = Select-String -Path $versionFile -Pattern '^VERSION\s*=\s*["'']([^"'']+)["'']' | Select-Object -First 1
              if ($match) {
                $v = $match.Matches[0].Groups[1].Value
                Write-Host "Read VERSION from version.py: $v"
              } else {
                Write-Host "::error::VERSION not found in version.py"
                exit 1
              }
            } else {
              Write-Host "::error::version.py not found"
              exit 1
            }
          }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "APP_VERSION = $v"

          # 代号（CODENAME / CODENAME_CN）也一律从 version.py 读 —— v2.1.0.0 的教训：
          # RELEASE-NOTES 头部曾经硬编码 "Sirius"，换了版本线（Vega）后发布页标题还写着旧名 ✗。
          # 现在模板里用 {{CODENAME}} / {{CODENAME_CN}} 占位，CI 来填 ✓。
          $cn = ""
          $cnCn = ""
          if (Test-Path $versionFile) {
            $m1 = Select-String -Path $versionFile -Pattern '^CODENAME\s*=\s*["'']([^"'']+)["'']' | Select-Object -First 1
            $m2 = Select-String -Path $versionFile -Pattern '^CODENAME_CN\s*=\s*["'']([^"'']+)["'']' | Select-Object -First 1
            if ($m1) { $cn = $m1.Matches[0].Groups[1].Value }
            if ($m2) { $cnCn = $m2.Matches[0].Groups[1].Value }
          }
          "APP_CODENAME=$cn" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_CODENAME_CN=$cnCn" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "APP_CODENAME = $cn / $cnCn"

          # 上一版 tag（发布页「与上一版对比」链接用）：取最近的非 installer 版本 tag，
          # 并排除本次要发的版本（重建同一版本时，对比基线应是它的前一版）。
          $prevTag = ""
          $releases = gh release list --exclude-drafts --limit 30 --json tagName 2>$null | ConvertFrom-Json
          foreach ($rel in $releases) {
            if ($rel.tagName -match '^v[0-9]' -and $rel.tagName -ne "v$v") { $prevTag = $rel.tagName; break }
          }
          "APP_PREV_TAG=$prevTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "APP_PREV_TAG = $prevTag"

      - name: Self-test release notes renderer
        shell: pwsh
        run: |
          # 渲染器自带 20+ 项断言（占位符残留 / 隐私规则 / 两套模板可渲染 / 日期时区）。
          # 放在构建之前：模板或脚本写坏了就立刻红，不必等装完包才发现发布页是坏的 ✗
          python .github/scripts/render_release_notes.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "发布说明渲染器自测失败" }

      - name: Build installer with ISCC
        shell: pwsh
        run: |
          & "$env:ISCC" "/DMyAppVersion=$env:APP_VERSION" "packaging\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败（退出码 $LASTEXITCODE）" }

      - name: Verify installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem "packaging\output\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "未找到编译产物 .exe" }
          Write-Host "产物: $($exe.FullName)"
          Write-Host "大小: $($exe.Length) 字节 ($([math]::Round($exe.Length/1MB,2)) MB)"
          Write-Host "SHA256: $((Get-FileHash $exe.FullName -Algorithm SHA256).Hash)"
          if ($exe.Length -lt 500000) { throw "产物过小，可能编译不完整" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrcomAutoLogin-Setup
          path: packaging/output/*.exe
          if-no-files-found: error

      - name: Publish Release (tag installer)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem "packaging\output\*.exe" | Select-Object -First 1
          $tag = "installer"
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()

          # 发布说明统一由 .github/scripts/render_release_notes.py 渲染：
          # 机器事实（版本 / 大小 / SHA256 / 对比链接 / 上海时区日期）全部由 CI 注入；
          # 渲染后若残留 {{...}} 或命中隐私规则 → 脚本非 0 退出 → 构建直接红 ✗
          # （旧实现是两个 step 各写一遍 $body.Replace(...)，改一处漏一处）
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-installer.md"
          $titleFile = Join-Path $env:RUNNER_TEMP "release-title-installer.txt"
          $renderArgs = @(
            ".github/scripts/render_release_notes.py",
            "--repo", $env:REPO_SLUG,
            "--template", "packaging/RELEASE-NOTES-installer.md",
            "--channel", "installer",
            "--version", "$env:APP_VERSION",
            "--codename", "$env:APP_CODENAME",
            "--codename-cn", "$env:APP_CODENAME_CN",
            "--asset", $exe.Name,
            "--size", "$($exe.Length)",
            "--sha256", $sha,
            "--commit", $env:COMMIT_SHA,
            "--run", $env:RUN_NUMBER,
            "--prev-tag", "$env:APP_PREV_TAG",
            "--out-file", $notesFile,
            "--title-out", $titleFile
          )
          & python @renderArgs
          if ($LASTEXITCODE -ne 0) { throw "发布说明渲染失败（详见上面的 [错误] 行）" }

          if ($env:INPUT_DRY_RUN -eq "true") {
            Write-Host "===== dry_run：渲染结果（不创建 / 不覆盖 release）====="
            Get-Content $notesFile -Raw
            exit 0
          }

          if ($env:GIT_REF -ne "refs/heads/main") {
            Write-Host "::warning::非 main 的构建只产出安装包 artifact，不发布 release（审计 P2-6；ref=$env:GIT_REF）"
            exit 0
          }

          $title = (Get-Content $titleFile -Raw).Trim()
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }
          gh release create $tag $exe.FullName --title $title --notes-file $notesFile --prerelease --target "$env:GITHUB_SHA"
          gh release view $tag --json url,tagName,name,isPrerelease,assets

      # P1-5：自动升级通道。`/releases/latest` 只返回**非 prerelease** release，
      # 所以这里发布带版本号的正式 release（tag = v{版本}），客户端才能取到版本 + digest。
      - name: Publish versioned release (tag v{version})
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem "packaging\output\*.exe" | Select-Object -First 1
          $tag = "v$env:APP_VERSION"
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()

          # 发布说明与 installer 同源：同一个渲染器 + packaging/RELEASE-NOTES.md
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-$tag.md"
          $titleFile = Join-Path $env:RUNNER_TEMP "release-title-$tag.txt"
          $renderArgs = @(
            ".github/scripts/render_release_notes.py",
            "--repo", $env:REPO_SLUG,
            "--template", "packaging/RELEASE-NOTES.md",
            "--channel", "versioned",
            "--version", "$env:APP_VERSION",
            "--codename", "$env:APP_CODENAME",
            "--codename-cn", "$env:APP_CODENAME_CN",
            "--asset", $exe.Name,
            "--size", "$($exe.Length)",
            "--sha256", $sha,
            "--commit", $env:COMMIT_SHA,
            "--run", $env:RUN_NUMBER,
            "--prev-tag", "$env:APP_PREV_TAG",
            "--out-file", $notesFile,
            "--title-out", $titleFile
          )
          & python @renderArgs
          if ($LASTEXITCODE -ne 0) { throw "发布说明渲染失败（详见上面的 [错误] 行）" }

          if ($env:INPUT_DRY_RUN -eq "true") {
            Write-Host "===== dry_run：渲染结果（不创建 / 不覆盖 release）====="
            Get-Content $notesFile -Raw
            exit 0
          }

          if ($env:GIT_REF -ne "refs/heads/main") {
            Write-Host "::warning::非 main 的构建只产出安装包 artifact，不发布正式版 release（审计 P2-6；ref=$env:GIT_REF）"
            exit 0
          }

          # 标题策略：优先 workflow_dispatch 的 title；其次沿用现有 release 的人工标题（避免 CI 覆盖）；
          # 都没有才用模板里的 RELEASE-TITLE（v{版本} — 简述）。
          $title = (Get-Content $titleFile -Raw).Trim()
          $old = gh release view $tag --json name 2>$null | ConvertFrom-Json
          if ($old -and $old.name) { $title = $old.name }
          if ($env:INPUT_TITLE -ne "") { $title = $env:INPUT_TITLE }
          # 审计 P1-1：同名版本 release 已存在 = version.py 没递增。旧行为是
          # delete + create（tag 被挪到新提交、同版本换本体）—— 已装客户端拿 remote==local
          # 就判「已是最新」，这次构建的补丁永远到不了用户 ✗。
          # 默认拒绝覆盖（CI 只给 warning，不红）；确需重发同一版本时显式 allow_republish。
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0 -and $env:INPUT_ALLOW_REPUBLISH -ne "true") {
            Write-Host "::warning::v$env:APP_VERSION 的 release 已存在 —— 版本号没有递增，已跳过正式版发布（installer 固定链接照常更新）。要重发同一版本请用 workflow_dispatch 且 allow_republish=true；否则请先 bump version.py。"
            gh release view $tag --json url,tagName,isPrerelease,assets
            exit 0
          }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }
          gh release create $tag $exe.FullName --title $title --notes-file $notesFile --target "$env:GITHUB_SHA"
          gh release view $tag --json url,tagName,name,isPrerelease,assets
