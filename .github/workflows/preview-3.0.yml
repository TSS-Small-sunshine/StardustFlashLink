name: 3.0 预览构建（跨平台矩阵）

# 3.0 线（Altair 牛郎星）：**只发预览版**，正式版留给便携版成型之后。
# 触发面只在 dev/** 与指向 dev/** 的 PR —— 不碰 main，所以 2.1.x（Vega）稳定线完全不受影响 ✓
on:
  push:
    branches: ['dev/**']
  pull_request:
    branches: ['dev/**']
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ① 单元测试：三个平台各跑一遍（核心是纯函数 + 本地 API，跨平台必须同绿 ✓）
  test:
    name: 测试（${{ matrix.os }}）
    # 卡住的 job 别一直占着 runner ✗（曾见过 windows-latest 上单测偶发挂住 ✓）
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: 工具链信息
        run: |
          rustup show
          cargo --version

      - name: 装 Slint 的 Linux 依赖（X11/Wayland/fontconfig；GUI 编译需要 ✓）
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev

      - name: cargo test
        run: cargo test --workspace --verbose
      - name: 内置自检（跑真二进制，不是单测 ✓）
        run: cargo run --release -p drcom-cli -- selfcheck

  # ② 交叉编译矩阵：覆盖需求里的每一类机器
  build:
    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # 交叉编译 + 六个目标的打包步骤很长，给一个上限 ✓（正常 15~25 分钟）
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          # ui: true = 在该 runner 上原生编译 Slint 界面（交叉编译 GUI 需要目标系统的
          # GL/X/Wayland sysroot，那是 M3 打包阶段的事 ✓；headless 核心依旧覆盖全部 6 个目标 ✓）
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu,   label: linux-x86_64,  apt: '', ui: true }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-gnu,  label: linux-aarch64, apt: gcc-aarch64-linux-gnu, ui: false }
          - { os: ubuntu-24.04, target: armv7-unknown-linux-gnueabihf, label: linux-armv7, apt: gcc-arm-linux-gnueabihf, ui: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   label: windows-x86_64, apt: '', ui: true }
          - { os: macos-14,      target: aarch64-apple-darwin,      label: macos-aarch64, apt: '', ui: true }
          - { os: macos-14,      target: x86_64-apple-darwin,       label: macos-x86_64,  apt: '', ui: false }
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉编译用的 gcc（仅 Linux 目标）
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: 添加 Rust 目标
        run: rustup target add ${{ matrix.target }}

      - name: 指定链接器（Linux 交叉编译必需，否则链接阶段会找不到 gcc ✗）
        if: matrix.apt != ''
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)   echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV ;;
            armv7-unknown-linux-gnueabihf) echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV ;;
          esac

      - name: cargo build（headless 核心 —— 6 个目标全部构建 ✓）
        run: cargo build --release --target ${{ matrix.target }} -p drcom-cli

      - name: 装 Slint 的 Linux 依赖（X11/Wayland 开发库；仅原生 GUI 构建需要）
        if: matrix.ui && startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev

      - name: cargo build（Slint GUI —— 仅原生编译的目标）
        if: matrix.ui
        run: cargo build --release --target ${{ matrix.target }} -p drcom-ui

      - name: 体积报告（用户要求：体积小，所以每版都量一下 ✓）
        shell: bash
        run: |
          # 用 wc -c 而不是 find -printf：macOS 的 BSD find 不认 -printf ✗
          for f in \
            "target/${{ matrix.target }}/release/stardust-flash-link" \
            "target/${{ matrix.target }}/release/stardust-flash-link.exe" \
            "target/${{ matrix.target }}/release/stardust-flash-link-app" \
            "target/${{ matrix.target }}/release/stardust-flash-link-app.exe" ; do
            if [ -f "$f" ]; then
              echo "SIZE  ${{ matrix.label }}  $(basename "$f")  $(wc -c < "$f") bytes"
            fi
          done

      - name: 组装安装包（ZIP + SHA256SUMS）—— 全程用我们自己的实现 ✓
        shell: bash
        run: |
          set -euo pipefail
          # ① 宿主编一个辅助程序：交叉编译的目标二进制在 runner 上跑不了 ✗，
          #    所以「生成包内文件」和「打 zip」都用宿主这份 ✓
          cargo build --release -p drcom-cli
          HOST_BIN="target/release/stardust-flash-link"
          # 注意：不能写 `[ -f x ] && y` ✗ —— set -e 下条件为假会让脚本直接退出 ✗
          if [ -f "${HOST_BIN}.exe" ]; then
            HOST_BIN="${HOST_BIN}.exe"
          fi

          # ② 目标平台的二进制名（Windows 带 .exe ✓）
          CLI_NAME="stardust-flash-link"
          APP_NAME="stardust-flash-link-app"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            CLI_NAME="stardust-flash-link.exe"
            APP_NAME="stardust-flash-link-app.exe"
          fi

          # ③ 摆好要装进包的目录 ✓
          STAGE="pkg/staging"
          rm -rf pkg dist
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${CLI_NAME}" "$STAGE/"
          if [ -f "target/${{ matrix.target }}/release/${APP_NAME}" ]; then
            cp "target/${{ matrix.target }}/release/${APP_NAME}" "$STAGE/"
          fi

          # ④ 包内说明文件（.desktop / deb-control / Info.plist / README.txt ✓）
          #    --target 必须显式给：宿主自报的目标是错的 ✗
          PKG_EXE="${CLI_NAME}"
          if [ -f "target/${{ matrix.target }}/release/${APP_NAME}" ]; then
            PKG_EXE="${APP_NAME}"
          fi
          # deb 的架构名要跟着**目标**走 ✗（宿主是 amd64，但包可能是 armhf ✓）
          DEB_ARCH=""
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)      DEB_ARCH="amd64" ;;
            aarch64-unknown-linux-gnu)     DEB_ARCH="arm64" ;;
            armv7-unknown-linux-gnueabihf) DEB_ARCH="armhf" ;;
          esac
          OUT=$("$HOST_BIN" package-files --out "$STAGE" --target "${{ matrix.label }}" \
            --exe "$PKG_EXE" --arch "$DEB_ARCH")
          printf '%s\n' "$OUT"
          NAME=$(printf '%s\n' "$OUT" | head -1)

          # ⑤ 用**自带 ZIP** 打包 ✓（CI 不需要外部 zip/tar ✓），再算 SHA256SUMS ✓
          mkdir -p dist
          "$HOST_BIN" archive --out "dist/${NAME}.zip" "$STAGE"
          SUM=$("$HOST_BIN" checksum "dist/${NAME}.zip" | awk '{print $1}')
          printf '%s  %s\n' "$SUM" "${NAME}.zip" > dist/SHA256SUMS

          # —— Linux：用我们生成的 deb 元数据组装 .deb ✓
          #    dpkg-deb 是 dpkg 自带的（ubuntu runner 上必有 ✓）；--root-owner-group 让交叉架构也能打 ✓
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then
            DEB_ROOT="pkg/deb"
            rm -rf "$DEB_ROOT"
            mkdir -p "$DEB_ROOT/DEBIAN" "$DEB_ROOT/usr/bin" "$DEB_ROOT/usr/share/applications"
            cp "$STAGE/deb-control" "$DEB_ROOT/DEBIAN/control"
            cp "$STAGE/${CLI_NAME}" "$DEB_ROOT/usr/bin/"
            if [ -f "$STAGE/${APP_NAME}" ]; then
              cp "$STAGE/${APP_NAME}" "$DEB_ROOT/usr/bin/"
            fi
            cp "$STAGE/stardust-flash-link.desktop" "$DEB_ROOT/usr/share/applications/"
            dpkg-deb --build --root-owner-group "$DEB_ROOT" "dist/${NAME}.deb"
            SUM=$("$HOST_BIN" checksum "dist/${NAME}.deb" | awk '{print $1}')
            printf '%s  %s\n' "$SUM" "${NAME}.deb" >> dist/SHA256SUMS
          fi

          # —— macOS：.app 包体 + .dmg（hdiutil 系统自带 ✓），里面放一个 /Applications 快捷方式 ✓
          if [ "${{ matrix.os }}" = "macos-14" ]; then
            GUEST="${CLI_NAME}"
            if [ -f "$STAGE/${APP_NAME}" ]; then
              GUEST="${APP_NAME}"
            fi
            APP_DIR="pkg/StardustFlashLink.app"
            rm -rf "$APP_DIR" pkg/dmg
            mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources" pkg/dmg
            cp "$STAGE/${GUEST}" "$APP_DIR/Contents/MacOS/"
            cp "$STAGE/Info.plist" "$APP_DIR/Contents/Info.plist"
            cp "$STAGE/README.txt" "$APP_DIR/Contents/Resources/" 2>/dev/null || true
            cp -R "$APP_DIR" pkg/dmg/
            ln -s /Applications pkg/dmg/Applications
            hdiutil create -volname "Stardust Flash Link" -srcfolder pkg/dmg \
              -ov -format UDZO "dist/${NAME}.dmg"
            SUM=$("$HOST_BIN" checksum "dist/${NAME}.dmg" | awk '{print $1}')
            printf '%s  %s\n' "$SUM" "${NAME}.dmg" >> dist/SHA256SUMS
          fi

          echo "--- dist ---"
          ls -l dist
          cat dist/SHA256SUMS

      - name: 上传产物（预览版：只挂 workflow artifact，不发 Release ✓）
        uses: actions/upload-artifact@v4
        with:
          name: stardust-flash-link-${{ matrix.label }}
          path: |
            desktop/dist/*
            desktop/pkg/staging/*
            desktop/target/${{ matrix.target }}/release/stardust-flash-link
            desktop/target/${{ matrix.target }}/release/stardust-flash-link.exe
            desktop/target/${{ matrix.target }}/release/stardust-flash-link-app
            desktop/target/${{ matrix.target }}/release/stardust-flash-link-app.exe
          if-no-files-found: warn
          retention-days: 14
