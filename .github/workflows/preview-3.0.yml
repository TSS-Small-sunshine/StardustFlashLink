name: 3.0 预览构建（跨平台矩阵）

# 3.0 线（Altair 牛郎星）：**只发预览版**，正式版留给便携版成型之后。
# 触发面只在 dev/** 与指向 dev/** 的 PR —— 不碰 main，所以 2.1.x（Vega）稳定线完全不受影响 ✓
on:
  push:
    branches: ['dev/**']
  pull_request:
    branches: ['dev/**']
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布预览版 Release（prerelease；发布前先把 APP_CHANNEL_SEQ +1）'
        type: boolean
        default: false
      allow_republish:
        description: '允许覆盖同版本预览 Release（默认否）'
        type: boolean
        default: false

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ① 单元测试：三个平台各跑一遍（核心是纯函数 + 本地 API，跨平台必须同绿 ✓）
  test:
    name: 测试（${{ matrix.os }}）
    # 卡住的 job 别一直占着 runner ✗（曾见过 windows-latest 上单测偶发挂住 ✓）
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macos-14 已被 GitHub 退役（报 'configuration not supported'）→ 用 macos-latest 跟随当前稳定版 ✗
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: 工具链信息
        run: |
          rustup show
          cargo --version

      - name: 装 Slint 的 Linux 依赖（X11/Wayland/fontconfig；GUI 编译需要 ✓）
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev

      - name: cargo test
        run: cargo test --workspace --verbose
      - name: 内置自检（跑真二进制，不是单测 ✓）
        run: cargo run --release -p drcom-cli -- selfcheck

  # ② 交叉编译矩阵：覆盖需求里的每一类机器
  build:
    name: 构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # 交叉编译 + 六个目标的打包步骤很长，给一个上限 ✓（正常 15~25 分钟）
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          # ui: true = 在该 runner 上原生编译 Slint 界面（交叉编译 GUI 需要目标系统的
          # GL/X/Wayland sysroot，那是 M3 打包阶段的事 ✓；headless 核心依旧覆盖全部 6 个目标 ✓）
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu,   label: linux-x86_64,  apt: '', ui: true }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-gnu,  label: linux-aarch64, apt: gcc-aarch64-linux-gnu, ui: false }
          - { os: ubuntu-24.04, target: armv7-unknown-linux-gnueabihf, label: linux-armv7, apt: gcc-arm-linux-gnueabihf, ui: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   label: windows-x86_64, apt: '', ui: true }
          - { os: macos-latest,  target: aarch64-apple-darwin,      label: macos-aarch64, apt: '', ui: true }
          - { os: macos-latest,  target: x86_64-apple-darwin,       label: macos-x86_64,  apt: '', ui: false }
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉编译用的 gcc（仅 Linux 目标）
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: 添加 Rust 目标
        run: rustup target add ${{ matrix.target }}

      - name: 指定链接器（Linux 交叉编译必需，否则链接阶段会找不到 gcc ✗）
        if: matrix.apt != ''
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)   echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV ;;
            armv7-unknown-linux-gnueabihf) echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV ;;
          esac

      - name: cargo build（headless 核心 —— 6 个目标全部构建 ✓）
        run: cargo build --release --target ${{ matrix.target }} -p drcom-cli

      - name: 装 Slint 的 Linux 依赖（X11/Wayland 开发库；仅原生 GUI 构建需要）
        if: matrix.ui && startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev

      - name: cargo build（Slint GUI —— 仅原生编译的目标）
        if: matrix.ui
        run: cargo build --release --target ${{ matrix.target }} -p drcom-ui

      - name: 体积报告（用户要求：体积小，所以每版都量一下 ✓）
        shell: bash
        run: |
          # 用 wc -c 而不是 find -printf：macOS 的 BSD find 不认 -printf ✗
          for f in \
            "target/${{ matrix.target }}/release/stardust-flash-link" \
            "target/${{ matrix.target }}/release/stardust-flash-link.exe" \
            "target/${{ matrix.target }}/release/stardust-flash-link-app" \
            "target/${{ matrix.target }}/release/stardust-flash-link-app.exe" ; do
            if [ -f "$f" ]; then
              echo "SIZE  ${{ matrix.label }}  $(basename "$f")  $(wc -c < "$f") bytes"
            fi
          done

      - name: 组装安装包（ZIP + SHA256SUMS）—— 全程用我们自己的实现 ✓
        shell: bash
        run: |
          set -euo pipefail
          # ① 宿主编一个辅助程序：交叉编译的目标二进制在 runner 上跑不了 ✗，
          #    所以「生成包内文件」和「打 zip」都用宿主这份 ✓
          cargo build --release -p drcom-cli
          HOST_BIN="target/release/stardust-flash-link"
          # 注意：不能写 `[ -f x ] && y` ✗ —— set -e 下条件为假会让脚本直接退出 ✗
          if [ -f "${HOST_BIN}.exe" ]; then
            HOST_BIN="${HOST_BIN}.exe"
          fi

          # ② 目标平台的二进制名（Windows 带 .exe ✓）
          CLI_NAME="stardust-flash-link"
          APP_NAME="stardust-flash-link-app"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            CLI_NAME="stardust-flash-link.exe"
            APP_NAME="stardust-flash-link-app.exe"
          fi

          # ③ 摆好要装进包的目录 ✓
          STAGE="pkg/staging"
          rm -rf pkg dist
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${CLI_NAME}" "$STAGE/"
          if [ -f "target/${{ matrix.target }}/release/${APP_NAME}" ]; then
            cp "target/${{ matrix.target }}/release/${APP_NAME}" "$STAGE/"
          fi

          # ④ 包内说明文件（.desktop / deb-control / Info.plist / README.txt ✓）
          #    --target 必须显式给：宿主自报的目标是错的 ✗
          PKG_EXE="${CLI_NAME}"
          if [ -f "target/${{ matrix.target }}/release/${APP_NAME}" ]; then
            PKG_EXE="${APP_NAME}"
          fi
          # deb 的架构名要跟着**目标**走 ✗（宿主是 amd64，但包可能是 armhf ✓）
          DEB_ARCH=""
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)      DEB_ARCH="amd64" ;;
            aarch64-unknown-linux-gnu)     DEB_ARCH="arm64" ;;
            armv7-unknown-linux-gnueabihf) DEB_ARCH="armhf" ;;
          esac
          OUT=$("$HOST_BIN" package-files --out "$STAGE" --target "${{ matrix.label }}" \
            --exe "$PKG_EXE" --arch "$DEB_ARCH")
          printf '%s\n' "$OUT"
          NAME=$(printf '%s\n' "$OUT" | head -1)

          # ⑤ 用**自带 ZIP** 打包 ✓（CI 不需要外部 zip/tar ✓），再算 SHA256SUMS ✓
          mkdir -p dist
          "$HOST_BIN" archive --out "dist/${NAME}.zip" "$STAGE"
          SUM=$("$HOST_BIN" checksum "dist/${NAME}.zip" | awk '{print $1}')
          printf '%s  %s\n' "$SUM" "${NAME}.zip" > dist/SHA256SUMS

          # —— Linux：用我们生成的 deb 元数据组装 .deb ✓
          #    dpkg-deb 是 dpkg 自带的（ubuntu runner 上必有 ✓）；--root-owner-group 让交叉架构也能打 ✓
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then
            DEB_ROOT="pkg/deb"
            rm -rf "$DEB_ROOT"
            mkdir -p "$DEB_ROOT/DEBIAN" "$DEB_ROOT/usr/bin" "$DEB_ROOT/usr/share/applications"
            cp "$STAGE/deb-control" "$DEB_ROOT/DEBIAN/control"
            cp "$STAGE/${CLI_NAME}" "$DEB_ROOT/usr/bin/"
            if [ -f "$STAGE/${APP_NAME}" ]; then
              cp "$STAGE/${APP_NAME}" "$DEB_ROOT/usr/bin/"
            fi
            cp "$STAGE/stardust-flash-link.desktop" "$DEB_ROOT/usr/share/applications/"
            dpkg-deb --build --root-owner-group "$DEB_ROOT" "dist/${NAME}.deb"
            SUM=$("$HOST_BIN" checksum "dist/${NAME}.deb" | awk '{print $1}')
            printf '%s  %s\n' "$SUM" "${NAME}.deb" >> dist/SHA256SUMS
          fi

          # —— macOS：.app 包体 + .dmg（hdiutil 系统自带 ✓），里面放一个 /Applications 快捷方式 ✓
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            GUEST="${CLI_NAME}"
            if [ -f "$STAGE/${APP_NAME}" ]; then
              GUEST="${APP_NAME}"
            fi
            APP_DIR="pkg/StardustFlashLink.app"
            rm -rf "$APP_DIR" pkg/dmg
            mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources" pkg/dmg
            cp "$STAGE/${GUEST}" "$APP_DIR/Contents/MacOS/"
            cp "$STAGE/Info.plist" "$APP_DIR/Contents/Info.plist"
            cp "$STAGE/README.txt" "$APP_DIR/Contents/Resources/" 2>/dev/null || true
            cp -R "$APP_DIR" pkg/dmg/
            ln -s /Applications pkg/dmg/Applications
            hdiutil create -volname "Stardust Flash Link" -srcfolder pkg/dmg \
              -ov -format UDZO "dist/${NAME}.dmg"
            SUM=$("$HOST_BIN" checksum "dist/${NAME}.dmg" | awk '{print $1}')
            printf '%s  %s\n' "$SUM" "${NAME}.dmg" >> dist/SHA256SUMS
          fi

          echo "--- dist ---"
          ls -l dist
          cat dist/SHA256SUMS

      - name: 上传产物（预览版：只挂 workflow artifact，不发 Release ✓）
        uses: actions/upload-artifact@v4
        with:
          name: stardust-flash-link-${{ matrix.label }}
          path: |
            desktop/dist/*
            desktop/pkg/staging/*
            desktop/target/${{ matrix.target }}/release/stardust-flash-link
            desktop/target/${{ matrix.target }}/release/stardust-flash-link.exe
            desktop/target/${{ matrix.target }}/release/stardust-flash-link-app
            desktop/target/${{ matrix.target }}/release/stardust-flash-link-app.exe
          if-no-files-found: warn
          retention-days: 14

  # ⑦ 预览版发布：仅手动触发（workflow_dispatch + publish_release=true）✓
  #    - 只发 prerelease：正式用户的自动升级收不到 ✓（R6）
  #    - 资产名沿用 CI 产物名 stardust-flash-link-<版本>-<目标>.zip/.deb/.dmg，
  #      与 3.0 更新模块 pick_asset 的匹配规则逐字对应 ✓
  publish-preview:
    name: 发布预览版 Release
    needs: [test, build]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 创建 prerelease + 上传资产
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本 / 通道号（严格按 lib.rs 解析，失败即红）
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          LIB="desktop/crates/drcom-core/src/lib.rs"
          VERSION=$(sed -n 's/^pub const APP_VERSION: &str = "\([0-9.]*\)";/\1/p' $LIB)
          SEQ=$(sed -n 's/^pub const APP_CHANNEL_SEQ: u32 = \([0-9]\+\);/\1/p' $LIB)
          test -n $VERSION || { echo "::error::解析不到 APP_VERSION"; exit 1; }
          test -n $SEQ || { echo "::error::解析不到 APP_CHANNEL_SEQ"; exit 1; }
          FULL=${VERSION}-preview.${SEQ}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "seq=$SEQ" >> "$GITHUB_OUTPUT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "tag=v$FULL" >> "$GITHUB_OUTPUT"
          echo "预览版本：$FULL（tag: v$FULL）"

      - name: 收集六目标产物
        uses: actions/download-artifact@v4
        with:
          pattern: stardust-flash-link-*
          path: artifacts
          merge-multiple: true

      - name: 整理可发布资产（只留 zip/deb/dmg，扁平化 + 生成 SHA256SUMS）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.deb' -o -name '*.dmg' \) -print0 \
            | xargs -0 -I{} cp -v {} release-assets/
          COUNT=$(find release-assets -type f | wc -l)
          echo "资产数量：$COUNT"
          test "$COUNT" -ge 6 || { echo "::error::资产数量不足（$COUNT < 6），拒绝发布"; exit 1; }
          ( cd release-assets && sha256sum ./* > SHA256SUMS && cat SHA256SUMS )
          ls -l release-assets

      - name: 生成预览版发布说明
        shell: bash
        run: |
          set -euo pipefail
          cat > PREVIEW-NOTES.md <<EOF
          ## 3.0 预览版 ${{ steps.ver.outputs.full }}

          > ⚠️ **这是 3.0「Altair」的开发预览版，不是正式版**：接口与行为仍可能变化；
          > 正式用户的自动升级**收不到**它（prerelease），只有把配置里 \`update_channel\` 改成
          > \`preview\` 才会收到。

          - 版本：\`${{ steps.ver.outputs.full }}\`（通道：preview）
          - 提交：\`${{ github.sha }}\`
          - 构建：[#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - 产物：Windows / Linux（x86_64、aarch64、armv7）/ macOS（x86_64、aarch64）的 ZIP / deb / dmg，见下方 assets
          - 校验：下载 asset \`SHA256SUMS\` 后 \`sha256sum -c\`（Windows 用 \`Get-FileHash\` 对照）

          ### 怎么升级到 3.0 预览
          - 命令行：\`stardust-flash-link update check --channel preview\` → \`update download <目录>\`（现在可直接 update apply 自我替换）；
          - 3.0 现在支持 **自我替换 / 回滚**：GUI「更新」→「检查更新」→「下载并安装」会把同目录的
            GUI 与 CLI 一起换掉（失败自动回滚）；装过一次后「回滚」行可一键回退（两步确认 + 自动重启）。
          - 命令行：update check --channel preview → update download <目录> → update apply <zip>
            （先 --dry-run 看计划），另有 update rollback / update backups 三个子命令。

          ### 已知限制
          - 3.0 仍处 DEV：没有托盘、没有 Windows 安装器（只出便携 zip / deb / dmg）；预览版**无代码签名**，
            只信 GitHub digest；.deb 装到 /usr/bin 后自我替换需要写权限（权限不足会明确失败、不动程序）；
          - 详细差异见仓库 \`docs/PLATFORMS.md\` 与 \`desktop/README.md\`。

          本发布由 CI 自动创建（\`.github/workflows/preview-3.0.yml\` 的 publish-preview job）。
          EOF

      - name: 创建 / 覆盖预览 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${{ inputs.allow_republish }}" != "true" ]; then
              echo "::error::$TAG 已存在。请先在 PR 里把 desktop/crates/drcom-core/src/lib.rs 的 APP_CHANNEL_SEQ +1，或勾选 allow_republish 重跑。"
              exit 1
            fi
            echo "覆盖模式：删除已有 release 与 tag 后按当前提交重建（allow_republish=true）"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "3.0 预览版 ${{ steps.ver.outputs.full }}" \
            --notes-file PREVIEW-NOTES.md \
            --prerelease \
            --latest=false
          echo "已发布：${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
